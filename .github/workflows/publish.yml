name: Publish Extension

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: write
      id-token: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci

    - name: Verify tag matches package.json version
      run: |
        node -e "
        const fs=require('fs');
        const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
        const tag=(process.env.GITHUB_REF_NAME||'').trim();
        const expected='v'+pkg.version;
        if(tag!==expected){
          console.error('Release tag ('+tag+') must match package.json version ('+expected+').');
          process.exit(1);
        }
        console.log('Tag/version OK: '+tag);
        "

    - name: Run lint
      run: npm run lint

    - name: Enforce unit test coverage
      run: npm run test:coverage

    - name: Download VSIX from GitHub Release assets
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="${GITHUB_REF_NAME}"
        gh release download "${TAG}" --pattern '*.vsix' --output cbor-viewer.vsix --repo "$GITHUB_REPOSITORY"
    
    - name: Upload VSIX as artifact
      uses: actions/upload-artifact@v4
      with:
        name: extension-vsix
        path: cbor-viewer.vsix

    - name: Azure Login (OIDC — no secrets stored)
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Publish to VS Code Marketplace
      run: npx vsce publish --azure-credential --packagePath cbor-viewer.vsix
