name: Publish Extension

on:
  release:
    types: [published]

jobs:
  publish:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci

    - name: Verify tag matches package.json version
      run: |
        node -e "
        const fs=require('fs');
        const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
        const tag=(process.env.GITHUB_REF_NAME||'').trim();
        const expected='v'+pkg.version;
        if(tag!==expected){
          console.error(`Release tag (${tag}) must match package.json version (${expected}).`);
          process.exit(1);
        }
        console.log(`Tag/version OK: ${tag}`);
        "

    - name: Run lint
      run: npm run lint

    - name: Enforce unit test coverage
      run: npm run test:coverage
    
    - name: Package extension
      run: npx vsce package --out cbor-viewer.vsix
    
    - name: Publish to VS Code Marketplace
      env:
        VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}
      run: npx vsce publish -p "$VSCE_TOKEN" --packagePath cbor-viewer.vsix
    
    - name: Upload VSIX as artifact
      uses: actions/upload-artifact@v4
      with:
        name: extension-vsix
        path: cbor-viewer.vsix
