name: Preview Release

on:
  push:
    branches: [main]

jobs:
  preview_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Enforce unit test coverage
        run: npm run test:coverage

      - name: Read version from package.json
        id: ver
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}-preview"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Package VSIX
        run: npx vsce package --out cbor-viewer-preview.vsix

      - name: Delete existing preview tag/release (if any)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          # Delete the release first (if it exists)
          RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases/tags/${TAG}" --jq '.id' 2>/dev/null || true)
          if [ -n "$RELEASE_ID" ]; then
            gh api -X DELETE "repos/${{ github.repository }}/releases/${RELEASE_ID}"
            echo "Deleted existing release ${TAG}"
          fi
          # Delete the tag (if it exists)
          git push origin ":refs/tags/${TAG}" 2>/dev/null || true
          echo "Cleaned up tag ${TAG}"

      - name: Create preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "${{ steps.ver.outputs.tag }} (Preview)"
          prerelease: true
          generate_release_notes: true
          body: |
            **Preview release** built from `main` at ${{ github.sha }}.

            This is an automated pre-release for testing. Install the VSIX manually in VS Code:
            1. Download `cbor-viewer-preview.vsix` below
            2. In VS Code: Extensions → `...` → Install from VSIX
          files: cbor-viewer-preview.vsix
