name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18.x, 20.x]
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run lint
      run: npm run lint
    
    - name: Compile TypeScript
      run: npm run compile
    
    - name: Run tests (Ubuntu)
      if: runner.os == 'Linux'
      run: xvfb-run -a npm test
    
    - name: Run tests (Windows/macOS)
      if: runner.os != 'Linux'
      run: npm test

  unit_coverage:
    name: Unit tests + coverage (PR)
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Run unit tests + enforce coverage
      run: npm run test:coverage

  changelog:
    name: Update CHANGELOG.md (PR)
    needs: [unit_coverage]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.head_ref }}
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
    - name: Fetch Copilot PR summary (best-effort)
      id: copilot
      uses: actions/github-script@v7
      with:
        script: |
          const owner = context.repo.owner;
          const repo = context.repo.repo;
          const issue_number = context.payload.pull_request.number;
          const comments = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
          const items = (comments.data || [])
            .filter(c => c && c.user && typeof c.user.login === 'string')
            .filter(c => /copilot/i.test(c.user.login))
            .filter(c => typeof c.body === 'string' && c.body.trim().length > 0);
          const latest = items.at(-1);
          core.setOutput('summary', latest ? latest.body : '');
          core.setOutput('source', latest ? `Copilot PR summary (${latest.user.login})` : '');
    - name: Update CHANGELOG.md from PR summary
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        COPILOT_PR_SUMMARY: ${{ steps.copilot.outputs.summary }}
        COPILOT_PR_SUMMARY_SOURCE: ${{ steps.copilot.outputs.source }}
      run: node scripts/update-changelog-from-pr.mjs
    - name: Commit and push CHANGELOG.md
      run: |
        if git diff --quiet -- CHANGELOG.md; then
          echo "CHANGELOG.md unchanged"
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add CHANGELOG.md
        git commit -m "chore(changelog): update Unreleased" -m "Update Unreleased section from PR summary." || exit 0
        if ! git push; then
          echo "::warning::Unable to push CHANGELOG.md update. This usually means the PR branch is protected. Update CHANGELOG.md manually (or relax branch protection / add a GitHub Actions bypass) and re-push."
          exit 0
        fi

  security:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run npm audit
      run: npm audit --audit-level=moderate
      continue-on-error: true
    
    - name: Check for outdated dependencies
      run: npm outdated
      continue-on-error: true
